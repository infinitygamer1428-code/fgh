<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Upload Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Bulk Upload Attendance</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('admin_dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4>Bulk Photo Upload</h4>
                    </div>
                    <div class="card-body">
                        <p class="lead">Upload multiple photos at once. Each photo should contain one student's face.</p>
                        
                        <form action="{{ url_for('mark_attendance_upload') }}" method="POST" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="subject" class="form-label">Subject</label>
                                <select name="subject" class="form-control" required>
                                    <option value="">Select Subject</option>
                                    {% for subject in subjects %}
                                    <option value="{{ subject.name }}">{{ subject.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="class_hour" class="form-label">Class Hour</label>
                                <select name="class_hour" class="form-control" required>
                                    <option value="">Select Hour</option>
                                    <option value="1">Hour 1</option>
                                    <option value="2">Hour 2</option>
                                    <option value="3">Hour 3</option>
                                    <option value="4">Hour 4</option>
                                    <option value="5">Hour 5</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="photos" class="form-label">Select Photos</label>
                                <input type="file" name="photos" class="form-control" multiple accept="image/*" required>
                                <small class="text-muted">You can select multiple photos</small>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-upload me-2"></i>Upload & Process
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
