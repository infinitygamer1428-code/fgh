<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login · Auto Attendance</title>
    <!-- Bootstrap (for structure only, heavily overridden) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 (for icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ---------- CREATIVE CONCEPT STYLING (same as homepage / admin reference) ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f8f9ff 0%, #eef2fa 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* Abstract vector background */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: radial-gradient(circle at 20% 30%, rgba(140, 158, 255, 0.12) 0%, transparent 25%),
                              radial-gradient(circle at 90% 70%, rgba(90, 200, 250, 0.1) 0%, transparent 35%),
                              repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        /* Floating shapes */
        .float-shape {
            position: absolute;
            top: 5%;
            right: 3%;
            width: 280px;
            height: 280px;
            background: rgba(200, 225, 255, 0.25);
            border-radius: 63% 37% 48% 52% / 38% 41% 59% 62%;
            filter: blur(40px);
            z-index: 0;
        }

        .float-shape-2 {
            position: absolute;
            bottom: 5%;
            left: 2%;
            width: 340px;
            height: 340px;
            background: rgba(170, 210, 255, 0.2);
            border-radius: 74% 26% 42% 58% / 57% 48% 52% 43%;
            filter: blur(55px);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        /* Concept header (the pill-shaped tag row) */
        .concept-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 2rem 3rem;
            margin-top: 1.2rem;
            margin-bottom: 2.2rem;
            padding: 0.5rem 1.5rem;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 80px;
            box-shadow: 0 10px 30px -10px rgba(0,20,40,0.15);
            border: 1px solid rgba(255,255,255,0.5);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .concept-header span {
            color: #1a2b4c;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .concept-header i {
            color: #3a5f8b;
            font-size: 1.2rem;
        }

        .logo-emblem {
            display: inline-block;
            background: #1e2f4a;
            color: white;
            font-weight: 700;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Main card – exactly the creative style */
        .card {
            border: none;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 36px;
            box-shadow: 0 25px 45px -15px rgba(18, 52, 86, 0.3);
            border: 1px solid rgba(255,255,255,0.6);
            overflow: hidden;
            transform: translateY(0);
            transition: all 0.3s ease;
            width: 100%;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 55px -18px rgba(20, 60, 120, 0.4);
        }

        /* Gradient header (exactly as provided) */
        .card-header {
            background: linear-gradient(135deg, #1d3f6e, #17355a);
            color: white;
            text-align: center;
            padding: 1.8rem 1.5rem;
            border-bottom: none;
            position: relative;
            overflow: hidden;
        }

        .card-header::before {
            content: "";
            position: absolute;
            top: -30px;
            right: -30px;
            width: 150px;
            height: 150px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        .card-header::after {
            content: "";
            position: absolute;
            bottom: -30px;
            left: -30px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        .card-header h3 {
            margin: 0;
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 1;
        }

        .card-header i {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: block;
            position: relative;
            z-index: 1;
        }

        .card-body {
            padding: 2.2rem 2.2rem 2.5rem 2.2rem;
        }

        /* Form labels (uppercase, as in concept) */
        .form-label {
            color: #1a3a5e;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            display: block;
        }

        /* Input fields with glassy background */
        .form-control {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(26, 58, 94, 0.1);
            border-radius: 16px;
            padding: 0.75rem 1.2rem;
            font-size: 1rem;
            transition: all 0.2s;
            color: #1a3a5e;
            width: 100%;
            margin-bottom: 1.2rem;
        }

        .form-control:focus {
            border-color: #1d3f6e;
            box-shadow: 0 0 0 0.2rem rgba(29, 63, 110, 0.15);
            background: white;
            outline: none;
        }

        .form-control::placeholder {
            color: #8ba0b8;
            font-weight: 400;
            opacity: 0.8;
        }

        /* Alert styling (flash messages) */
        .alert {
            border-radius: 16px;
            border: none;
            background: rgba(220, 53, 69, 0.1);
            color: #b02a37;
            padding: 1rem 1.2rem;
            font-weight: 500;
            backdrop-filter: blur(5px);
            border-left: 4px solid #dc3545;
            margin-bottom: 1.5rem;
        }

        /* Primary button with gradient (exactly as concept) */
        .btn-primary {
            background: linear-gradient(145deg, #1f4172, #17355a);
            border: none;
            border-radius: 40px;
            padding: 0.9rem 2rem;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 16px -6px rgba(0,60,110,0.3);
            transition: all 0.2s;
            margin-top: 0.5rem;
            width: 100%;
            color: white;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: linear-gradient(145deg, #17355a, #0e2d4f);
            transform: scale(1.02);
            box-shadow: 0 12px 20px -10px #0a2740;
        }

        /* Back link styling (exactly as concept) */
        .back-link {
            margin-top: 1.8rem;
            text-align: center;
        }

        .back-link a {
            color: #1a3a5e;
            text-decoration: none;
            font-weight: 600;
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
            transition: all 0.2s;
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .back-link a:hover {
            background: rgba(255,255,255,0.6);
            color: #0e2d4f;
            transform: translateX(-5px);
        }

        .back-link i {
            margin-right: 8px;
            transition: transform 0.2s;
        }

        .back-link a:hover i {
            transform: translateX(-3px);
        }

        /* Decorative icon (student version) */
        .student-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .student-icon i {
            font-size: 4rem;
            color: #1d3f6e;
            background: rgba(255, 255, 255, 0.3);
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px dashed rgba(29, 63, 110, 0.2);
        }

        /* Register prompt (styling to match concept) */
        .register-prompt {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 1rem;
            color: #1e3f60;
            padding-top: 0.8rem;
        }

        .register-prompt a {
            color: #1f4172;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid #a7c1dd;
        }

        .register-prompt a:hover {
            border-bottom: 2px solid #1f4172;
        }

        /* Get started pulse (same as homepage) */
        .get-started-pulse {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: rgba(25, 55, 90, 0.85);
            backdrop-filter: blur(10px);
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 600;
            box-shadow: 0 15px 30px -8px #10253b;
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 999;
            cursor: default;
            font-size: 1rem;
        }

        .get-started-pulse i {
            margin-right: 8px;
            color: #b5e4ff;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card-body {
                padding: 1.5rem;
            }
            .card-header h3 {
                font-size: 1.6rem;
            }
            .concept-header {
                gap: 1rem;
            }
        }

        /* optional input group styling (if you want to use later) — not used here but kept */
        .input-group-text {
            background: rgba(255,255,255,0.9);
            border: 2px solid rgba(26, 58, 94, 0.1);
            border-radius: 16px 0 0 16px;
            border-right: none;
            color: #1a3a5e;
        }
        .input-group .form-control {
            border-radius: 0 16px 16px 0;
        }

        /* Override Bootstrap container padding */
        .container {
            padding-left: 0;
            padding-right: 0;
        }
    </style>
</head>
<body>
    <!-- floating background shapes (same creative concept) -->
    <div class="float-shape"></div>
    <div class="float-shape-2"></div>

    <div class="container">
    
        <!-- Main card with student login form (creative styling applied) -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-user-graduate"></i>
                <h3>Student Login</h3>
            </div>
            <div class="card-body">
                <!-- Flash messages (alerts) styled as concept -->
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            {% for message in messages %}
                                {{ message }}
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}

                <!-- Decorative student icon (dashed circle) -->
                <div class="student-icon">
                    <i class="fas fa-user-circle"></i>
                </div>

                <!-- Login form (exactly as original but with creative CSS) -->
                <form method="POST">
                    <div>
                        <label for="student_id" class="form-label"><i class="fas fa-id-badge me-1"></i>Student ID</label>
                        <input type="text" class="form-control" id="student_id" name="student_id" placeholder="e.g. S1001" required>
                    </div>
                    <div>
                        <label for="password" class="form-label"><i class="fas fa-lock me-1"></i>Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="··········" required>
                    </div>

                    <button type="submit" class="btn-primary">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                </form>

                <!-- Back to Home link (styled) -->
                <div class="back-link">
                    <a href="{{ url_for('index') }}"><i class="fas fa-arrow-left"></i> Back to Home</a>
                </div>

                <!-- Register prompt (with matching concept) -->
                <div class="register-prompt">
                    <p>Don't have an account? <a href="{{ url_for('register') }}">Register here <i class="fas fa-chevron-right ms-1" style="font-size:0.8rem;"></i></a></p>
                </div>
            </div>
        </div>

        <!-- subtle extra concept element (could be the "get started" pulse but we place a small note) -->
    </div>

    <!-- get started pulse (as in original concept) -->
    <div class="get-started-pulse">
        <i class="fas fa-shield-alt"></i> Auto Attendance · Student
    </div>
</body>
</html>
